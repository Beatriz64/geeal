<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GEEAL 2026 – Grupo de Evangelização Espírita</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul1:#e8f4fd;--azul2:#c9e6f8;--azul3:#90c7ef;--azul4:#4a9fd4;--azul5:#1e6fa3;
  --verde:#d4edda;--verde2:#28a745;--amarelo:#fff3cd;--amarelo2:#e6a817;--rosa:#f8d7e3;
  --cinza:#f0f4f8;--branco:#ffffff;--texto:#2c3e50;--subtexto:#5a7a9a;
  --sombra:0 4px 16px rgba(74,159,212,.13);--sombra2:0 8px 32px rgba(30,111,163,.18);
  --bg-body:linear-gradient(135deg,#e8f4fd 0%,#f0f8ff 50%,#e8f4fd 100%);
  --bg-card:#ffffff;--bg-stats:#ffffff;--bg-controles:#ffffff;
  --border-stats:2px solid var(--azul2);--border-controles:2px solid var(--azul2)
}
body.dark{
  --azul1:#1a2a3a;--azul2:#1e3a52;--azul3:#2a5a7a;--azul4:#4a9fd4;--azul5:#7ec8f0;
  --verde:#0d2b16;--verde2:#4caf6e;--amarelo:#2b2200;--amarelo2:#f0c040;
  --cinza:#151e27;--branco:#1c2c3c;--texto:#d0e8f8;--subtexto:#7aadcc;
  --sombra:0 4px 16px rgba(0,0,0,.4);--sombra2:0 8px 32px rgba(0,0,0,.6);
  --bg-body:linear-gradient(135deg,#0d1b2a 0%,#111e2d 50%,#0d1b2a 100%);
  --bg-card:#162030;--bg-stats:#111e2d;--bg-controles:#111e2d;
  --border-stats:2px solid #1e3a52;--border-controles:2px solid #1e3a52
}
body{font-family:'Nunito',sans-serif;background:var(--bg-body);min-height:100vh;color:var(--texto);transition:background .3s,color .3s}

/* HEADER */
header{background:linear-gradient(135deg,var(--azul5) 0%,var(--azul4) 60%,#3ab0e8 100%);color:#fff;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-40px;left:-40px;width:160px;height:160px;background:rgba(255,255,255,.06);border-radius:50%}
header::after{content:'';position:absolute;bottom:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.05);border-radius:50%}
.star{display:inline-block;font-size:2.8rem;margin-bottom:.4rem;filter:drop-shadow(0 2px 8px rgba(255,255,255,.4))}
header h1{font-family:'Lora',serif;font-size:clamp(1.4rem,4vw,2.1rem);font-weight:700;letter-spacing:.5px}
header p{font-size:.95rem;opacity:.88;margin-top:.3rem}
.tagline{font-family:'Lora',serif;font-style:italic;font-size:.9rem;opacity:.75;margin-top:.2rem}

/* STATS */
.stats{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;padding:1.2rem 1.5rem;background:var(--bg-stats);border-bottom:var(--border-stats)}
.stat{background:var(--azul1);border-radius:12px;padding:.6rem 1.2rem;text-align:center;min-width:110px;border:1.5px solid var(--azul2)}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--azul5);line-height:1}
.stat-label{font-size:.72rem;color:var(--subtexto);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat.realizado .stat-num{color:var(--verde2)}
.stat.realizado{background:var(--verde);border-color:#a8d5b5}
.stat.proximo .stat-num{color:var(--amarelo2)}
.stat.proximo{background:var(--amarelo);border-color:#f0d080}

/* CONTROLES */
.controles{background:var(--bg-controles);padding:1rem 1.5rem;border-bottom:var(--border-controles);display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.busca-wrap{flex:1;min-width:200px;position:relative}
.busca-wrap input{width:100%;padding:.55rem .9rem .55rem 2.4rem;border:2px solid var(--azul2);border-radius:10px;font-family:inherit;font-size:.9rem;outline:none;transition:.2s}
.busca-wrap input:focus{border-color:var(--azul4)}
.busca-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--azul4);font-size:1rem}
.filtros-wrap{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
select{padding:.5rem .8rem;border:2px solid var(--azul2);border-radius:10px;font-family:inherit;font-size:.85rem;background:var(--bg-card);color:var(--texto);outline:none;cursor:pointer}
select:focus{border-color:var(--azul4)}
.view-toggle{display:flex;gap:.3rem}
.view-btn{padding:.45rem .7rem;border:2px solid var(--azul2);background:var(--bg-card);border-radius:8px;cursor:pointer;font-size:1rem;transition:.2s;color:var(--texto)}
.view-btn.ativo{background:var(--azul4);border-color:var(--azul4);color:#fff}

/* GRID */
.container{padding:1.2rem 1.5rem;max-width:1400px;margin:0 auto}
.resultado-info{font-size:.85rem;color:var(--subtexto);margin-bottom:.8rem;font-weight:600}

/* CARDS */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.card{background:var(--bg-card);border-radius:16px;box-shadow:var(--sombra);padding:1.2rem;border-left:5px solid var(--azul3);transition:.2s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--sombra2);border-left-color:var(--azul5)}
.card.realizado{border-left-color:var(--verde2)}
.card.proximo{border-left-color:var(--amarelo2)}
.card.livre{border-left-color:#e67e22}
.card-num{font-size:.75rem;font-weight:800;color:var(--azul4);text-transform:uppercase;letter-spacing:1px}
.card-tema{font-family:'Lora',serif;font-size:1rem;font-weight:700;color:var(--texto);margin:.3rem 0 .5rem;line-height:1.3}
.card-meta{font-size:.8rem;color:var(--subtexto);display:flex;flex-wrap:wrap;gap:.3rem .8rem}
.card-meta span{display:flex;align-items:center;gap:.25rem}
.tag{display:inline-block;padding:.15rem .6rem;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tag.realizado{background:var(--verde);color:#1a7a35}
.tag.proximo{background:var(--amarelo);color:#8a6200}
.tag.livre{background:#fdebd0;color:#a04000}
.tag.bloco{background:var(--azul1);color:var(--azul5)}
.card-footer{margin-top:.8rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem}
.btn-anexo{font-size:.75rem;padding:.3rem .7rem;background:var(--azul1);border:1.5px solid var(--azul3);color:var(--azul5);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;transition:.2s}
.btn-anexo:hover{background:var(--azul2)}
.anexo-count{font-size:.7rem;color:var(--subtexto);font-weight:600}

/* LISTA */
.lista{display:flex;flex-direction:column;gap:.5rem}
.item-lista{background:var(--bg-card);border-radius:12px;box-shadow:0 2px 8px rgba(74,159,212,.1);padding:.8rem 1.1rem;display:flex;align-items:center;gap:.8rem;border-left:4px solid var(--azul3);cursor:pointer;transition:.2s}
.item-lista:hover{transform:translateX(4px);box-shadow:var(--sombra)}
.item-lista.realizado{border-left-color:var(--verde2)}
.item-lista.proximo{border-left-color:var(--amarelo2)}
.item-lista.livre{border-left-color:#e67e22}
.item-num{min-width:32px;height:32px;background:var(--azul1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:var(--azul5)}
.item-info{flex:1;min-width:0}
.item-tema{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:.75rem;color:var(--subtexto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,60,100,.45);backdrop-filter:blur(3px);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg-card);border-radius:20px;box-shadow:var(--sombra2);max-width:680px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-header{background:linear-gradient(135deg,var(--azul5),var(--azul4));color:#fff;padding:1.5rem 1.5rem 1rem;border-radius:20px 20px 0 0;position:sticky;top:0;z-index:2}
.modal-num{font-size:.8rem;font-weight:800;opacity:.8;text-transform:uppercase;letter-spacing:1px}
.modal-titulo{font-family:'Lora',serif;font-size:1.2rem;font-weight:700;margin:.3rem 0;line-height:1.35}
.modal-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.btn-fechar{position:absolute;top:.8rem;right:.8rem;background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.btn-fechar:hover{background:rgba(255,255,255,.35)}
.modal-body{padding:1.2rem 1.5rem}
.modal-section{margin-bottom:1.1rem}
.modal-section h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--azul4);font-weight:800;margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem}
.modal-section p{font-size:.9rem;line-height:1.6;color:var(--texto)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.info-item{background:var(--azul1);border-radius:10px;padding:.6rem .8rem}
.info-item label{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--subtexto);font-weight:700;display:block;margin-bottom:.2rem}
.info-item span{font-size:.88rem;font-weight:600;color:var(--texto)}
.refs-lista{display:flex;flex-direction:column;gap:.3rem}
.ref-item{background:var(--cinza);border-radius:8px;padding:.4rem .7rem;font-size:.82rem;color:var(--subtexto)}
/* ANEXOS */
.anexo-area{background:var(--azul1);border-radius:12px;padding:1rem;border:2px dashed var(--azul3)}
.anexo-input-wrap{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem}
.btn-selecionar{background:var(--azul4);color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;transition:.2s}
.btn-selecionar:hover{background:var(--azul5)}
#fileInput{display:none}
.arquivos-lista{display:flex;flex-direction:column;gap:.4rem}
.arquivo-item{background:var(--bg-stats);border-radius:8px;padding:.45rem .7rem;display:flex;align-items:center;gap:.5rem;box-shadow:0 1px 4px rgba(74,159,212,.12)}
.arquivo-icon{font-size:1.1rem}
.arquivo-nome{flex:1;font-size:.82rem;color:var(--texto);font-weight:600;word-break:break-all}
.arquivo-acoes{display:flex;gap:.3rem;flex-shrink:0}
.btn-dl,.btn-rm{border:none;border-radius:6px;padding:.25rem .5rem;cursor:pointer;font-size:.75rem;font-weight:700;transition:.2s}
.btn-dl{background:#d4edda;color:#1a7a35}
.btn-dl:hover{background:#b8ddc4}
.btn-rm{background:#f8d7e3;color:#a0001a}
.btn-rm:hover{background:#f0b0c0}
.vazio{text-align:center;padding:2rem;color:var(--subtexto);font-style:italic}

@media(max-width:600px){
  .info-grid{grid-template-columns:1fr}
  .controles{flex-direction:column;align-items:stretch}
  .busca-wrap{min-width:0}
  .filtros-wrap{flex-direction:column;align-items:stretch}
  select{width:100%}
}
</style>
</head>
<body>

<header>
  <button id="btnDark" onclick="toggleDark()" title="Alternar modo escuro" style="position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:.35rem .85rem;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;z-index:10">🌙 Dark</button>
  <h1>GEEAL 2026</h1>
  <p>Grupo de Educação Espírita André Luiz</p>
  <div class="tagline">Amar, Conhecer e Servir</div>
</header>

<div class="stats" id="stats"></div>

<div class="controles">
  <div class="busca-wrap">
    <span class="busca-icon">🔍</span>
    <input type="text" id="busca" placeholder="Buscar por tema, responsável, referência, objetivo…"/>
  </div>
  <div class="filtros-wrap">
    <select id="filtroStatus">
      <option value="">📋 Todos os Status</option>
      <option value="realizado">✅ Realizados</option>
      <option value="proximo">⏳ Próximos</option>
      <option value="livre">🌟 Tema Livre</option>
    </select>
    <select id="filtroBloco">
      <option value="">🏷️ Todos os Blocos</option>
      <option value="Valores & Personagens">Valores & Personagens</option>
      <option value="O Evangelho Segundo o Espiritismo">O Evangelho</option>
      <option value="Doutrina Espírita">Doutrina Espírita</option>
      <option value="Mediunidade">Mediunidade</option>
      <option value="Céu e Inferno">Céu e Inferno</option>
      <option value="A Gênese">A Gênese</option>
      <option value="Complementar">Complementar</option>
    </select>
    <div class="view-toggle">
      <button class="view-btn ativo" id="btnGrade" title="Grade">⊞</button>
      <button class="view-btn" id="btnLista" title="Lista">≡</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="resultado-info" id="resultadoInfo"></div>
  <div id="conteudo"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <button class="btn-fechar" id="btnFechar">✕</button>
      <div class="modal-num" id="mNum"></div>
      <div class="modal-titulo" id="mTitulo"></div>
      <div class="modal-tags" id="mTags"></div>
    </div>
    <div class="modal-body">
      <div class="modal-section" id="mObjWrap">
        <h3>🎯 Objetivo</h3>
        <p id="mObj"></p>
      </div>
      <div class="info-grid">
        <div class="info-item"><label>👤 Responsável</label><span id="mResp"></span></div>
        <div class="info-item"><label>📅 Período de Estudo</label><span id="mPer"></span></div>
        <div class="info-item"><label>📬 Entrega</label><span id="mEnt"></span></div>
        <div class="info-item"><label>🏷️ Bloco Temático</label><span id="mBloco"></span></div>
      </div>
      <div class="modal-section" id="mRefWrap" style="margin-top:1rem">
        <h3>📚 Referências Bibliográficas</h3>
        <div class="refs-lista" id="mRefs"></div>
      </div>
      <div class="modal-section" style="margin-top:1rem">
        <h3>📤 Compartilhar no WhatsApp</h3>
        <button id="btnCopiarTexto" onclick="copiarModeloAula()" style="width:100%;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border:none;border-radius:12px;padding:.7rem 1rem;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:.2s">
          📋 Copiar modelo de aula para WhatsApp
        </button>
        <div id="copiadoMsg" style="display:none;text-align:center;color:#128c7e;font-size:.82rem;font-weight:700;margin-top:.4rem">✅ Copiado! É só colar no WhatsApp.</div>
      </div>

      <div class="modal-section" style="margin-top:1rem">
        <h3>📎 Arquivos Anexados</h3>
        <div class="anexo-area">
          <div class="anexo-input-wrap">
            <button class="btn-selecionar" id="btnSel">📎 Adicionar arquivo</button>
            <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.txt"/>
            <span style="font-size:.78rem;color:var(--subtexto)">PDF, DOC, imagens</span>
          </div>
          <div class="arquivos-lista" id="arquivosLista"></div>
        </div>
      </div>
    </div>
  </div>
</div>

let viewMode = 'grade';
let aulaAtiva = null;

// STATUS DISPLAY
function statusLabel(s){
  if(s==='realizado') return {tag:'realizado',txt:'✅ Realizado'};
  if(s==='livre') return {tag:'livre',txt:'🌟 Tema Livre'};
  return {tag:'proximo',txt:'⏳ Próximo'};
}

// STATS
function renderStats(){
  const total = AULAS.length;
  const real = AULAS.filter(a=>a.status==='realizado').length;
  const prox = AULAS.filter(a=>a.status==='proximo').length;
  const livre = AULAS.filter(a=>a.status==='livre').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Total de Aulas</div></div>
    <div class="stat realizado"><div class="stat-num">${real}</div><div class="stat-label">Realizadas</div></div>
    <div class="stat proximo"><div class="stat-num">${prox}</div><div class="stat-label">Próximas</div></div>
    <div class="stat" style="background:#fdebd0;border-color:#f0c090"><div class="stat-num" style="color:#a04000">${livre}</div><div class="stat-label">Tema Livre</div></div>
  `;
}

// FILTER
function filtrar(){
  const q = document.getElementById('busca').value.toLowerCase();
  const st = document.getElementById('filtroStatus').value;
  const bl = document.getElementById('filtroBloco').value;
  return AULAS.filter(a=>{
    const matchQ = !q || [a.tema,a.resp,a.refs,a.obj,a.subtema||''].join(' ').toLowerCase().includes(q);
    const matchSt = !st || a.status===st;
    const matchBl = !bl || a.bloco===bl;
    return matchQ && matchSt && matchBl;
  });
}

// RENDER
function getAnexos(n){
  try{ return JSON.parse(localStorage.getItem('geeal_anexos_'+n)||'[]'); }catch(e){ return []; }
}
function saveAnexos(n,arr){ localStorage.setItem('geeal_anexos_'+n, JSON.stringify(arr)); }

function fileIcon(name){
  const ext = name.split('.').pop().toLowerCase();
  if(['pdf'].includes(ext)) return '📄';
  if(['doc','docx'].includes(ext)) return '📝';
  if(['png','jpg','jpeg','gif','webp'].includes(ext)) return '🖼️';
  return '📎';
}

function renderCard(a){
  const sl = statusLabel(a.status);
  const anexos = getAnexos(a.n);
  return `<div class="card ${a.status}" data-n="${a.n}" onclick="abrirModal(${a.n})">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">
      <div class="card-num">Aula ${a.n}</div>
      <span class="tag ${sl.tag}">${sl.txt}</span>
    </div>
    <div class="card-tema">${a.tema}</div>
    ${a.subtema?`<div style="font-size:.78rem;color:var(--subtexto);font-style:italic;margin-bottom:.3rem">${a.subtema}</div>`:''}
    <div class="card-meta">
      <span>👤 ${a.resp}</span>
      <span>📅 ${a.periodo}</span>
    </div>
    <div style="margin-top:.4rem"><span class="tag bloco">${a.bloco}</span></div>
    <div class="card-footer">
      <button class="btn-anexo" onclick="event.stopPropagation();abrirModal(${a.n},true)">📎 Anexos</button>
      <span class="anexo-count">${anexos.length>0?anexos.length+' arquivo(s)':''}</span>
    </div>
  </div>`;
}

function renderItem(a){
  const sl = statusLabel(a.status);
  return `<div class="item-lista ${a.status}" onclick="abrirModal(${a.n})">
    <div class="item-num">${a.n}</div>
    <div class="item-info">
      <div class="item-tema">${a.tema}</div>
      <div class="item-sub">👤 ${a.resp} · 📅 ${a.periodo} · ${a.bloco}</div>
    </div>
    <div class="item-right">
      <span class="tag ${sl.tag}">${sl.txt}</span>
    </div>
  </div>`;
}

function render(){
  const lista = filtrar();
  document.getElementById('resultadoInfo').textContent = `Exibindo ${lista.length} de ${AULAS.length} aulas`;
  const el = document.getElementById('conteudo');
  if(lista.length===0){
    el.innerHTML=`<div class="vazio">🔍 Nenhuma aula encontrada com esses filtros.</div>`;
    return;
  }
  if(viewMode==='grade'){
    el.innerHTML=`<div class="grade">${lista.map(renderCard).join('')}</div>`;
  } else {
    el.innerHTML=`<div class="lista">${lista.map(renderItem).join('')}</div>`;
  }
}

// MODAL
function abrirModal(n, focoAnexo=false){
  const a = AULAS.find(x=>x.n===n);
  aulaAtiva = n;
  const sl = statusLabel(a.status);
  document.getElementById('mNum').textContent = `Aula ${a.n}`;
  document.getElementById('mTitulo').textContent = a.tema;
  document.getElementById('mTags').innerHTML = `<span class="tag ${sl.tag}">${sl.txt}</span><span class="tag bloco">${a.bloco}</span>`;
  const objWrap = document.getElementById('mObjWrap');
  if(a.obj){ objWrap.style.display=''; document.getElementById('mObj').textContent=a.obj; }
  else objWrap.style.display='none';
  document.getElementById('mResp').textContent = a.resp;
  document.getElementById('mPer').textContent = a.periodo;
  document.getElementById('mEnt').textContent = a.entrega;
  document.getElementById('mBloco').textContent = a.bloco;
  const refWrap = document.getElementById('mRefWrap');
  if(a.refs){
    refWrap.style.display='';
    document.getElementById('mRefs').innerHTML = a.refs.split('/').map(r=>`<div class="ref-item">📖 ${r.trim()}</div>`).join('');
  } else refWrap.style.display='none';
  renderArquivos(n);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
  if(focoAnexo) setTimeout(()=>{document.getElementById('btnSel').scrollIntoView({behavior:'smooth'})},200);
}

function fecharModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  aulaAtiva=null;
  render();
}

function renderArquivos(n){
  const arr = getAnexos(n);
  const lista = document.getElementById('arquivosLista');
  if(!arr.length){ lista.innerHTML=`<div style="font-size:.82rem;color:var(--subtexto);font-style:italic;text-align:center;padding:.5rem">Nenhum arquivo anexado ainda.</div>`; return; }
  lista.innerHTML = arr.map((f,i)=>`
    <div class="arquivo-item">
      <span class="arquivo-icon">${fileIcon(f.name)}</span>
      <span class="arquivo-nome">${f.name}</span>
      <div class="arquivo-acoes">
        <button class="btn-dl" onclick="downloadArquivo(${n},${i})">⬇️ Baixar</button>
        <button class="btn-rm" onclick="removerArquivo(${n},${i})">🗑️</button>
      </div>
    </div>`).join('');
}

function downloadArquivo(n,i){
  const arr = getAnexos(n);
  const f = arr[i];
  if(!f) return;
  const a = document.createElement('a');
  a.href = f.data;
  a.download = f.name;
  a.click();
}

function removerArquivo(n,i){
  const arr = getAnexos(n);
  arr.splice(i,1);
  saveAnexos(n,arr);
  renderArquivos(n);
}

function copiarModeloAula(){
  const a = AULAS.find(x=>x.n===aulaAtiva);
  if(!a) return;
  const sl = statusLabel(a.status);
  let txt = '';
  txt += `✡️ *GEEAL 2026 — Grupo de Educação Espírita André Luiz*\n`;
  txt += `${'─'.repeat(38)}\n\n`;
  txt += `📖 *Aula ${a.n} — ${a.tema}*\n`;
  if(a.subtema) txt += `_${a.subtema}_\n`;
  txt += `\n`;
  txt += `🏷️ *Bloco:* ${a.bloco}\n`;
  txt += `${sl.txt}\n`;
  txt += `\n`;
  if(a.obj){
    txt += `🎯 *Objetivo:*\n${a.obj}\n\n`;
  }
  if(a.refs){
    txt += `📚 *Referências Bibliográficas:*\n`;
    a.refs.split('/').forEach(r=> txt += `• ${r.trim()}\n`);
    txt += `\n`;
  }
  txt += `👤 *Responsável:* ${a.resp}\n`;
  txt += `📅 *Período de Estudo:* ${a.periodo}\n`;
  txt += `📬 *Entrega:* ${a.entrega}\n`;
  txt += `\n_"Amar, Conhecer e Servir"_ 🕊️`;

  navigator.clipboard.writeText(txt).then(()=>{
    const msg = document.getElementById('copiadoMsg');
    msg.style.display='block';
    setTimeout(()=> msg.style.display='none', 3000);
  }).catch(()=>{
    // fallback para dispositivos sem clipboard API
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const msg = document.getElementById('copiadoMsg');
    msg.style.display='block';
    setTimeout(()=> msg.style.display='none', 3000);
  });
}

document.getElementById('btnSel').onclick = ()=> document.getElementById('fileInput').click();

document.getElementById('fileInput').onchange = function(){
  const files = Array.from(this.files);
  let pendentes = files.length;
  if(!pendentes) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const arr = getAnexos(aulaAtiva);
      arr.push({name:file.name, data:e.target.result, size:file.size});
      saveAnexos(aulaAtiva, arr);
      pendentes--;
      if(pendentes===0) renderArquivos(aulaAtiva);
    };
    reader.readAsDataURL(file);
  });
  this.value='';
};

// EVENTOS
document.getElementById('busca').addEventListener('input', render);
document.getElementById('filtroStatus').addEventListener('change', render);
document.getElementById('filtroBloco').addEventListener('change', render);
document.getElementById('btnGrade').onclick=()=>{ viewMode='grade'; document.getElementById('btnGrade').classList.add('ativo'); document.getElementById('btnLista').classList.remove('ativo'); render(); };
document.getElementById('btnLista').onclick=()=>{ viewMode='lista'; document.getElementById('btnLista').classList.add('ativo'); document.getElementById('btnGrade').classList.remove('ativo'); render(); };
document.getElementById('btnFechar').onclick = fecharModal;
document.getElementById('overlay').onclick = e=>{ if(e.target===document.getElementById('overlay')) fecharModal(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fecharModal(); });

function toggleDark(){
  const dark = document.body.classList.toggle('dark');
  document.getElementById('btnDark').textContent = dark ? '☀️ Claro' : '🌙 Dark';
  localStorage.setItem('geeal_dark', dark ? '1' : '0');
}
// restaurar preferência
if(localStorage.getItem('geeal_dark')==='1'){
  document.body.classList.add('dark');
  document.getElementById('btnDark').textContent='☀️ Claro';
}

// INIT
renderStats();
render();
</script>
