<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

  --bg-body:linear-gradient(135deg,#e8f4fd 0%,#f0f8ff 50%,#e8f4fd 100%);
  --bg-card:#ffffff;--bg-stats:#ffffff;--bg-controles:#ffffff;
  --border-stats:2px solid var(--azul2);--border-controles:2px solid var(--azul2)

body.dark{

  --cinza:#151e27;--branco:#1c2c3c;--texto:#d0e8f8;--subtexto:#7aadcc;
  --sombra:0 4px 16px rgba(0,0,0,.4);--sombra2:0 8px 32px rgba(0,0,0,.6);
  --bg-body:linear-gradient(135deg,#0d1b2a 0%,#111e2d 50%,#0d1b2a 100%);
  --bg-card:#162030;--bg-stats:#111e2d;--bg-controles:#111e2d;
  --border-stats:2px solid #1e3a52;--border-controles:2px solid #1e3a52
}
body{font-family:'Nunito',sans-serif;background:var(--bg-body);min-height:100vh;color:var(--texto);transition:background .3s,color .3s}
header{background:linear-gradient(135deg,var(--azul5) 0%,var(--azul4) 60%,#3ab0e8 100%);color:#fff;padding:2rem 1.5rem 1.5rem;text-align:center;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-40px;left:-40px;width:160px;height:160px;background:rgba(255,255,255,.06);border-radius:50%}
header::after{content:'';position:absolute;bottom:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.05);border-radius:50%}
header h1{font-family:'Lora',serif;font-size:clamp(1.4rem,4vw,2.1rem);font-weight:700}
header p{font-size:.95rem;opacity:.88;margin-top:.3rem}
.tagline{font-family:'Lora',serif;font-style:italic;font-size:.9rem;opacity:.75;margin-top:.2rem}
.stats{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;padding:1.2rem 1.5rem;background:var(--bg-stats);border-bottom:var(--border-stats)}
.stat{background:var(--azul1);border-radius:12px;padding:.6rem 1.2rem;text-align:center;min-width:110px;border:1.5px solid var(--azul2)}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--azul5);line-height:1}
.stat-label{font-size:.72rem;color:var(--subtexto);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat.realizado .stat-num{color:var(--verde2)}
.stat.realizado{background:var(--verde);border-color:#a8d5b5}
.stat.proximo .stat-num{color:var(--amarelo2)}
.stat.proximo{background:var(--amarelo);border-color:#f0d080}
.controles{background:var(--bg-controles);padding:1rem 1.5rem;border-bottom:var(--border-controles);display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.busca-wrap{flex:1;min-width:200px;position:relative}
.busca-wrap input{width:100%;padding:.55rem .9rem .55rem 2.4rem;border:2px solid var(--azul2);border-radius:10px;font-family:inherit;font-size:.9rem;outline:none;background:var(--bg-card);color:var(--texto)}
.busca-wrap input:focus{border-color:var(--azul4)}
.busca-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--azul4)}
.filtros-wrap{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
select{padding:.5rem .8rem;border:2px solid var(--azul2);border-radius:10px;font-family:inherit;font-size:.85rem;background:var(--bg-card);color:var(--texto);outline:none;cursor:pointer}
select:focus{border-color:var(--azul4)}
.view-toggle{display:flex;gap:.3rem}
.view-btn{padding:.45rem .7rem;border:2px solid var(--azul2);background:var(--bg-card);border-radius:8px;cursor:pointer;font-size:1rem;transition:.2s;color:var(--texto)}
.view-btn.ativo{background:var(--azul4);border-color:var(--azul4);color:#fff}
.container{padding:1.2rem 1.5rem;max-width:1400px;margin:0 auto}
.resultado-info{font-size:.85rem;color:var(--subtexto);margin-bottom:.8rem;font-weight:600}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.card{background:var(--bg-card);border-radius:16px;box-shadow:var(--sombra);padding:1.2rem;border-left:5px solid var(--azul3);transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:var(--sombra2);border-left-color:var(--azul5)}
.card.realizado{border-left-color:var(--verde2)}
.card.proximo{border-left-color:var(--amarelo2)}
.card.livre{border-left-color:#e67e22}
.card-num{font-size:.75rem;font-weight:800;color:var(--azul4);text-transform:uppercase;letter-spacing:1px}
.card-tema{font-family:'Lora',serif;font-size:1rem;font-weight:700;color:var(--texto);margin:.3rem 0 .5rem;line-height:1.3}
.card-meta{font-size:.8rem;color:var(--subtexto);display:flex;flex-wrap:wrap;gap:.3rem .8rem}
.tag{display:inline-block;padding:.15rem .6rem;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tag.realizado{background:var(--verde);color:#1a7a35}
.tag.proximo{background:var(--amarelo);color:#8a6200}
.tag.livre{background:#fdebd0;color:#a04000}
.tag.bloco{background:var(--azul1);color:var(--azul5)}
.card-footer{margin-top:.8rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem}
.btn-anexo{font-size:.75rem;padding:.3rem .7rem;background:var(--azul1);border:1.5px solid var(--azul3);color:var(--azul5);border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700}
.anexo-count{font-size:.7rem;color:var(--subtexto);font-weight:600}
.lista{display:flex;flex-direction:column;gap:.5rem}
.item-lista{background:var(--bg-card);border-radius:12px;box-shadow:0 2px 8px rgba(74,159,212,.1);padding:.8rem 1.1rem;display:flex;align-items:center;gap:.8rem;border-left:4px solid var(--azul3);cursor:pointer;transition:.2s}
.item-lista:hover{transform:translateX(4px)}
.item-lista.realizado{border-left-color:var(--verde2)}
.item-lista.proximo{border-left-color:var(--amarelo2)}
.item-lista.livre{border-left-color:#e67e22}
.item-num{min-width:32px;height:32px;background:var(--azul1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:var(--azul5)}
.item-info{flex:1;min-width:0}
.item-tema{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:.75rem;color:var(--subtexto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.overlay{display:none;position:fixed;inset:0;background:rgba(20,60,100,.45);backdrop-filter:blur(3px);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg-card);border-radius:20px;box-shadow:var(--sombra2);max-width:680px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-header{background:linear-gradient(135deg,var(--azul5),var(--azul4));color:#fff;padding:1.5rem 1.5rem 1rem;border-radius:20px 20px 0 0;position:sticky;top:0;z-index:2}
.modal-num{font-size:.8rem;font-weight:800;opacity:.8;text-transform:uppercase;letter-spacing:1px}
.modal-titulo{font-family:'Lora',serif;font-size:1.2rem;font-weight:700;margin:.3rem 0;line-height:1.35}
.modal-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.btn-fechar{position:absolute;top:.8rem;right:.8rem;background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.modal-body{padding:1.2rem 1.5rem}
.modal-section{margin-bottom:1.1rem}
.modal-section h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--azul4);font-weight:800;margin-bottom:.4rem}
.modal-section p{font-size:.9rem;line-height:1.6;color:var(--texto)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.info-item{background:var(--azul1);border-radius:10px;padding:.6rem .8rem}
.info-item label{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--subtexto);font-weight:700;display:block;margin-bottom:.2rem}
.info-item span{font-size:.88rem;font-weight:600;color:var(--texto)}
.refs-lista{display:flex;flex-direction:column;gap:.3rem}
.ref-item{background:var(--cinza);border-radius:8px;padding:.4rem .7rem;font-size:.82rem;color:var(--subtexto)}
.anexo-area{background:var(--azul1);border-radius:12px;padding:1rem;border:2px dashed var(--azul3)}
.anexo-input-wrap{display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem}
.btn-selecionar{background:var(--azul4);color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700}
#fileInput{display:none}
.arquivos-lista{display:flex;flex-direction:column;gap:.4rem}
.arquivo-item{background:var(--bg-stats);border-radius:8px;padding:.45rem .7rem;display:flex;align-items:center;gap:.5rem}
.arquivo-icon{font-size:1.1rem}
.arquivo-nome{flex:1;font-size:.82rem;color:var(--texto);font-weight:600;word-break:break-all}
.arquivo-acoes{display:flex;gap:.3rem;flex-shrink:0}
.btn-dl,.btn-rm{border:none;border-radius:6px;padding:.25rem .5rem;cursor:pointer;font-size:.75rem;font-weight:700}
.btn-dl{background:#d4edda;color:#1a7a35;text-decoration:none;display:inline-block}
.btn-rm{background:#f8d7e3;color:#a0001a}
.vazio{text-align:center;padding:2rem;color:var(--subtexto);font-style:italic}
@media(max-width:600px){
  .info-grid{grid-template-columns:1fr}
  .controles{flex-direction:column;align-items:stretch}
  select{width:100%}
}
</style>
</head>

async function sbListar(aulaId) {
  try {
    var r = await fetch(SB_URL + '/storage/v1/object/list/' + BUCKET, {
      method: 'POST',
      headers: Object.assign({}, sbHeaders(), {'Content-Type': 'application/json'}),
      body: JSON.stringify({ prefix: 'aula_' + aulaId + '/', limit: 100, offset: 0 })
    });
    var data = await r.json();
    return (Array.isArray(data) ? data : []).filter(function(f){ return f.name && f.name !== '.emptyFolderPlaceholder'; });
  } catch(e) { return []; }
}

async function sbUpload(aulaId, file) {
  var path = 'aula_' + aulaId + '/' + Date.now() + '_' + file.name;
  var r = await fetch(SB_URL + '/storage/v1/object/' + BUCKET + '/' + path, {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), {'Content-Type': file.type || 'application/octet-stream'}),
    body: file
  });
  if (!r.ok) { var e = await r.json(); throw new Error(e.message || 'Erro no upload'); }
  return path;
}

async function sbDeletar(path) {
  await fetch(SB_URL + '/storage/v1/object/' + BUCKET, {
    method: 'DELETE',
    headers: Object.assign({}, sbHeaders(), {'Content-Type': 'application/json'}),
    body: JSON.stringify({ prefixes: [path] })
  });
}

// ─────────────────────────────────────────────────────────────

var viewMode = 'grade';
var aulaAtiva = null;

function statusLabel(s){
  if(s==='realizado') return {tag:'realizado',txt:'✅ Realizado'};
  if(s==='livre') return {tag:'livre',txt:'🌟 Tema Livre'};
  return {tag:'proximo',txt:'⏳ Próximo'};
}

function renderStats(){
  var total=AULAS.length, real=0, prox=0, livre=0;
  AULAS.forEach(function(a){ if(a.status==='realizado') real++; else if(a.status==='livre') livre++; else prox++; });
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="stat-num">'+total+'</div><div class="stat-label">Total de Aulas</div></div>'+
    '<div class="stat realizado"><div class="stat-num">'+real+'</div><div class="stat-label">Realizadas</div></div>'+
    '<div class="stat proximo"><div class="stat-num">'+prox+'</div><div class="stat-label">Próximas</div></div>'+
    '<div class="stat" style="background:#fdebd0;border-color:#f0c090"><div class="stat-num" style="color:#a04000">'+livre+'</div><div class="stat-label">Tema Livre</div></div>';
}

function filtrar(){
  var q=document.getElementById('busca').value.toLowerCase();
  var st=document.getElementById('filtroStatus').value;
  var bl=document.getElementById('filtroBloco').value;
  return AULAS.filter(function(a){
    var matchQ=!q||[a.tema,a.resp,a.refs,a.obj,a.subtema||''].join(' ').toLowerCase().indexOf(q)>=0;
    var matchSt=!st||a.status===st;
    var matchBl=!bl||a.bloco===bl;
    return matchQ&&matchSt&&matchBl;
  });
}

function fileIcon(name){
  var ext=name.split('.').pop().toLowerCase();
  if(ext==='pdf') return '📄';
  if(ext==='doc'||ext==='docx') return '📝';
  if(['png','jpg','jpeg','gif','webp'].indexOf(ext)>=0) return '🖼️';
  return '📎';
}

function renderCard(a){
  var sl=statusLabel(a.status);
  return '<div class="card '+a.status+'" onclick="abrirModal('+a.n+')">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">'+
    '<div class="card-num">Aula '+a.n+'</div>'+
    '<span class="tag '+sl.tag+'">'+sl.txt+'</span></div>'+
    '<div class="card-tema">'+a.tema+'</div>'+
    (a.subtema?'<div style="font-size:.78rem;color:var(--subtexto);font-style:italic;margin-bottom:.3rem">'+a.subtema+'</div>':'')+
    '<div class="card-meta"><span>👤 '+a.resp+'</span><span>📅 '+a.periodo+'</span></div>'+
    '<div style="margin-top:.4rem"><span class="tag bloco">'+a.bloco+'</span></div>'+
    '<div class="card-footer">'+
    '<button class="btn-anexo" onclick="event.stopPropagation();abrirModal('+a.n+',true)">📎 Anexos</button>'+
    '</div></div>';
}

function renderItem(a){
  var sl=statusLabel(a.status);
  return '<div class="item-lista '+a.status+'" onclick="abrirModal('+a.n+')">'+
    '<div class="item-num">'+a.n+'</div>'+
    '<div class="item-info"><div class="item-tema">'+a.tema+'</div>'+
    '<div class="item-sub">👤 '+a.resp+' · 📅 '+a.periodo+' · '+a.bloco+'</div></div>'+
    '<div class="item-right"><span class="tag '+sl.tag+'">'+sl.txt+'</span></div></div>';
}

function render(){
  var lista=filtrar();
  document.getElementById('resultadoInfo').textContent='Exibindo '+lista.length+' de '+AULAS.length+' aulas';
  var el=document.getElementById('conteudo');
  if(!lista.length){ el.innerHTML='<div class="vazio">🔍 Nenhuma aula encontrada.</div>'; return; }
  if(viewMode==='grade'){
    el.innerHTML='<div class="grade">'+lista.map(renderCard).join('')+'</div>';
  } else {
    el.innerHTML='<div class="lista">'+lista.map(renderItem).join('')+'</div>';
  }
}

function abrirModal(n, focoAnexo){
  var a=AULAS.find(function(x){ return x.n===n; });
  aulaAtiva=n;
  var sl=statusLabel(a.status);
  document.getElementById('mNum').textContent='Aula '+a.n;
  document.getElementById('mTitulo').textContent=a.tema;
  document.getElementById('mTags').innerHTML='<span class="tag '+sl.tag+'">'+sl.txt+'</span><span class="tag bloco">'+a.bloco+'</span>';
  var objWrap=document.getElementById('mObjWrap');
  if(a.obj){ objWrap.style.display=''; document.getElementById('mObj').textContent=a.obj; }
  else objWrap.style.display='none';
  document.getElementById('mResp').textContent=a.resp;
  document.getElementById('mPer').textContent=a.periodo;
  document.getElementById('mEnt').textContent=a.entrega;
  document.getElementById('mBloco').textContent=a.bloco;
  var refWrap=document.getElementById('mRefWrap');
  if(a.refs){
    refWrap.style.display='';
    document.getElementById('mRefs').innerHTML=a.refs.split('/').map(function(r){ return '<div class="ref-item">📖 '+r.trim()+'</div>'; }).join('');
  } else refWrap.style.display='none';
  renderArquivos(n);
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
  if(focoAnexo) setTimeout(function(){ document.getElementById('btnSel').scrollIntoView({behavior:'smooth'}); },200);
}

function fecharModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  aulaAtiva=null;
}

async function renderArquivos(n){
  var lista=document.getElementById('arquivosLista');
  lista.innerHTML='<div style="font-size:.82rem;color:var(--subtexto);text-align:center;padding:.5rem">⏳ Carregando…</div>';
  var arquivos=await sbListar(n);
  if(!arquivos.length){
    lista.innerHTML='<div style="font-size:.82rem;color:var(--subtexto);font-style:italic;text-align:center;padding:.5rem">Nenhum arquivo anexado ainda.</div>';
    return;
  }
  lista.innerHTML=arquivos.map(function(f){
    var path='aula_'+n+'/'+f.name;
    var url=sbPublicUrl(path);
    var nome=f.name.replace(/^\d+_/,'');
    return '<div class="arquivo-item">'+
      '<span class="arquivo-icon">'+fileIcon(nome)+'</span>'+
      '<span class="arquivo-nome">'+nome+'</span>'+
      '<div class="arquivo-acoes">'+
      '<a class="btn-dl" href="'+url+'" target="_blank">⬇️ Baixar</a>'+
      '<button class="btn-rm" onclick="removerArquivo(\''+path+'\','+n+')">🗑️</button>'+
      '</div></div>';
  }).join('');
}

async function removerArquivo(path,n){
  if(!confirm('Remover este arquivo para todos?')) return;
  await sbDeletar(path);
  renderArquivos(n);
}

function copiarModeloAula(){
  var a=AULAS.find(function(x){ return x.n===aulaAtiva; });
  if(!a) return;
  var sl=statusLabel(a.status);
  var txt='✡️ *GEEAL 2026 — Grupo de Educação Espírita André Luiz*\n';
  txt+='──────────────────────────────────────\n\n';
  txt+='📖 *Aula '+a.n+' — '+a.tema+'*\n';
  if(a.subtema) txt+='_'+a.subtema+'_\n';
  txt+='\n🏷️ *Bloco:* '+a.bloco+'\n'+sl.txt+'\n\n';
  if(a.obj) txt+='🎯 *Objetivo:*\n'+a.obj+'\n\n';
  if(a.refs){
    txt+='📚 *Referências:*\n';
    a.refs.split('/').forEach(function(r){ txt+='• '+r.trim()+'\n'; });
    txt+='\n';
  }
  txt+='👤 *Responsável:* '+a.resp+'\n';
  txt+='📅 *Período:* '+a.periodo+'\n';
  txt+='📬 *Entrega:* '+a.entrega+'\n\n';
  txt+='_"Amar, Conhecer e Servir"_ 🕊️';
  navigator.clipboard.writeText(txt).then(function(){
    var msg=document.getElementById('copiadoMsg');
    msg.style.display='block';
    setTimeout(function(){ msg.style.display='none'; },3000);
  }).catch(function(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    var msg=document.getElementById('copiadoMsg');
    msg.style.display='block';
    setTimeout(function(){ msg.style.display='none'; },3000);
  });
}

function toggleDark(){
  var dark=document.body.classList.toggle('dark');
  document.getElementById('btnDark').textContent=dark?'☀️ Claro':'🌙 Dark';
  localStorage.setItem('geeal_dark',dark?'1':'0');
}
if(localStorage.getItem('geeal_dark')==='1'){
  document.body.classList.add('dark');
  document.getElementById('btnDark').textContent='☀️ Claro';
}

document.getElementById('busca').addEventListener('input',render);
document.getElementById('filtroStatus').addEventListener('change',render);
document.getElementById('filtroBloco').addEventListener('change',render);
document.getElementById('btnGrade').onclick=function(){ viewMode='grade'; document.getElementById('btnGrade').classList.add('ativo'); document.getElementById('btnLista').classList.remove('ativo'); render(); };
document.getElementById('btnLista').onclick=function(){ viewMode='lista'; document.getElementById('btnLista').classList.add('ativo'); document.getElementById('btnGrade').classList.remove('ativo'); render(); };
document.getElementById('btnFechar').onclick=fecharModal;
document.getElementById('overlay').onclick=function(e){ if(e.target===document.getElementById('overlay')) fecharModal(); };
document.addEventListener('keydown',function(e){ if(e.key==='Escape') fecharModal(); });

document.getElementById('btnSel').onclick=function(){ document.getElementById('fileInput').click(); };
document.getElementById('fileInput').onchange=async function(){
  var files=Array.from(this.files);
  if(!files.length) return;
  var btn=document.getElementById('btnSel');
  btn.textContent='⏳ Enviando…'; btn.disabled=true;
  for(var i=0;i<files.length;i++){
    try{ await sbUpload(aulaAtiva,files[i]); }
    catch(e){ alert('Erro ao enviar '+files[i].name); }
  }
  btn.textContent='📎 Adicionar arquivo'; btn.disabled=false;
  this.value='';
  renderArquivos(aulaAtiva);
};

renderStats();
render();
</script>
